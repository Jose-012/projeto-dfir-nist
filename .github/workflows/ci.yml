name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-gates:
    name: Linux x86_64 quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup CPython 3.14.6
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            pkg-config \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-bin \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Setup Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
          rustup default 1.100.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # target/ fica fora do cache: 1,88 GiB compactado causou ENOSPC na
          # restauração da execução 44578097661. O lock continua na chave.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-1.100.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-1.100.0-

      - name: Install QA tools
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.151,cargo-audit@0.22.2,cargo-deny@0.20.2,just@1.59.0
          checksum: true
          fallback: none

      - name: Diagnose toolchain
        run: just doctor

      - name: Inspect locked dependency graph
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo tree --locked -e features > /dev/null

      - name: Run Rust gates
        run: just verify

      - name: Run supply-chain gates
        run: |
          cargo audit
          just supply-chain

      - name: Run documentation gate
        run: just doc-gate

      - name: Run headless end-to-end gate with real engine
        run: |
          df -h "$GITHUB_WORKSPACE"
          # Libera artefatos temporários de teste sem reduzir DFIR_MIN_FREE_DISK_BYTES.
          # O E2E reconstrói dfir-app e dfir-engine a partir deste checkout.
          cargo clean
          df -h "$GITHUB_WORKSPACE"
          just e2e tests/fixtures/senai-demo.evtx
        env:
          DFIR_ENGINE_SANDBOX: required
