nextest-version = "0.9.140"

# O teste de integração executa o binário real, não apenas o harness de testes.
# No build do workspace, o Cargo pode deixar esse artefato ausente; o setup roda
# depois da compilação dos testes e antes de qualquer teste de sandbox.
experimental = ["setup-scripts"]

[scripts.setup.build-sandbox-engine]
command = [
    "cargo",
    "build",
    "--locked",
    "--package",
    "dfir-engine",
    "--bin",
    "dfir-engine",
]

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "5s" }

[[profile.default.scripts]]
filter = "binary_id(=dfir-engine::sandbox)"
setup = "build-sandbox-engine"
